name: Build Push and Deploy ECS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - local
          - stage
          - production
      image_tag:
        description: "Immutable image tag (for example: git sha)"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 30

    outputs:
      frontend_image: ${{ steps.images.outputs.frontend_image }}
      backend_image: ${{ steps.images.outputs.backend_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate frontend build-time environment URLs
        run: |
          set -euo pipefail

          required_keys=(
            NEXT_PUBLIC_APP_URL
            NEXT_PUBLIC_API_BASE_URL
            NEXT_PUBLIC_AUTH_API_BASE_URL
          )

          for key in "${required_keys[@]}"; do
            value=$(grep -E "^${key}=" .env.production | head -n 1 | cut -d '=' -f2- || true)

            if [ -z "${value}" ]; then
              echo "::error::Missing ${key} in .env.production"
              exit 1
            fi

            if ! printf '%s' "${value}" | grep -Eq '^https?://'; then
              echo "::error::${key} must be an absolute URL in .env.production"
              exit 1
            fi

            if printf '%s' "${value}" | grep -Eq '\.example($|/)'; then
              echo "::error::${key} uses a placeholder domain (${value}). Update .env.production before deploy."
              exit 1
            fi
          done

          echo "Frontend build-time URL validation passed."

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image names
        id: images
        run: |
          echo "frontend_image=${{ vars.ECR_FRONTEND_REPOSITORY }}:${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          echo "backend_image=${{ vars.ECR_BACKEND_REPOSITORY }}:${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"

      - name: Build and push frontend image
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --file Dockerfile.frontend \
            --tag "${{ steps.images.outputs.frontend_image }}" \
            --push \
            .

      - name: Verify frontend image architecture
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${{ steps.images.outputs.frontend_image }}" --raw \
            | jq -r '.manifests[]?.platform | "os=\(.os) arch=\(.architecture) variant=\(.variant // "")"'

      - name: Build and push backend image
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --file Dockerfile.backend \
            --tag "${{ steps.images.outputs.backend_image }}" \
            --push \
            .

      - name: Verify backend image architecture
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${{ steps.images.outputs.backend_image }}" --raw \
            | jq -r '.manifests[]?.platform | "os=\(.os) arch=\(.architecture) variant=\(.variant // "")"'

  deploy-ecs:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: ${{ inputs.environment }}-approval
    timeout-minutes: 30

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Register frontend task definition revision
        run: |
          set -euo pipefail
          CURRENT_TD_ARN=$(aws ecs describe-services \
            --cluster "${{ vars.ECS_CLUSTER_NAME }}" \
            --services "${{ vars.ECS_FRONTEND_SERVICE_NAME }}" \
            --query 'services[0].taskDefinition' --output text)
          echo "PREVIOUS_FRONTEND_TD_ARN=$CURRENT_TD_ARN" >> "$GITHUB_ENV"

          aws ecs describe-task-definition --task-definition "$CURRENT_TD_ARN" --query 'taskDefinition' > frontend-taskdef.json

          jq --arg IMAGE "${{ needs.build-and-push.outputs.frontend_image }}" '
            del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
            | .containerDefinitions = (.containerDefinitions | map(if .name == "madar-stage-app" then .image = $IMAGE else . end))
          ' frontend-taskdef.json > frontend-taskdef-updated.json

          NEW_TD_ARN=$(aws ecs register-task-definition --cli-input-json file://frontend-taskdef-updated.json --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "NEW_FRONTEND_TD_ARN=$NEW_TD_ARN" >> "$GITHUB_ENV"

      - name: Register backend task definition revision
        run: |
          set -euo pipefail
          CURRENT_TD_ARN=$(aws ecs describe-services \
            --cluster "${{ vars.ECS_CLUSTER_NAME }}" \
            --services "${{ vars.ECS_BACKEND_SERVICE_NAME }}" \
            --query 'services[0].taskDefinition' --output text)
          echo "PREVIOUS_BACKEND_TD_ARN=$CURRENT_TD_ARN" >> "$GITHUB_ENV"

          aws ecs describe-task-definition --task-definition "$CURRENT_TD_ARN" --query 'taskDefinition' > backend-taskdef.json

          jq --arg IMAGE "${{ needs.build-and-push.outputs.backend_image }}" '
            del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
            | .containerDefinitions = (.containerDefinitions | map(if .name == "madar-stage-auth-backend" then .image = $IMAGE else . end))
          ' backend-taskdef.json > backend-taskdef-updated.json

          NEW_TD_ARN=$(aws ecs register-task-definition --cli-input-json file://backend-taskdef-updated.json --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "NEW_BACKEND_TD_ARN=$NEW_TD_ARN" >> "$GITHUB_ENV"

          CONTAINER_NAME=$(jq -r '.containerDefinitions[0].name' backend-taskdef.json)
          echo "BACKEND_CONTAINER_NAME=$CONTAINER_NAME" >> "$GITHUB_ENV"

      # Runs before the services switch to the new task definition, so a failed migration aborts
      # the deploy with the old code still serving. Without this step migrations never ran at all
      # on deploy -- a shipped migration silently never reached the database (migration 044's
      # zid_oauth_connections.store_domain landed as code while the column didn't exist, and the
      # Zid tracking route 500'd in production until it was applied by hand).
      #
      # Runs as a one-off task on the new backend task definition, so it executes inside the VPC
      # with the same secrets/env as the service -- the database isn't publicly reachable, so a
      # runner-side migration would need a tunnel/bastion.
      - name: Run database migrations
        run: |
          set -euo pipefail

          NETWORK_CONFIG=$(aws ecs describe-services \
            --cluster "${{ vars.ECS_CLUSTER_NAME }}" \
            --services "${{ vars.ECS_BACKEND_SERVICE_NAME }}" \
            --query 'services[0].networkConfiguration' --output json)

          OVERRIDES=$(jq -n --arg NAME "$BACKEND_CONTAINER_NAME" '
            {containerOverrides: [{name: $NAME, command: ["node","--import","tsx","src/identity-platform/migrate.ts"]}]}
          ')

          TASK_ARN=$(aws ecs run-task \
            --cluster "${{ vars.ECS_CLUSTER_NAME }}" \
            --task-definition "$NEW_BACKEND_TD_ARN" \
            --launch-type FARGATE \
            --network-configuration "$NETWORK_CONFIG" \
            --overrides "$OVERRIDES" \
            --started-by "deploy-migrations" \
            --query 'tasks[0].taskArn' --output text)

          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
            echo "::error::Failed to start the migration task."
            exit 1
          fi

          echo "Migration task: $TASK_ARN"
          aws ecs wait tasks-stopped \
            --cluster "${{ vars.ECS_CLUSTER_NAME }}" \
            --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "${{ vars.ECS_CLUSTER_NAME }}" \
            --tasks "$TASK_ARN" \
            --query "tasks[0].containers[?name=='${BACKEND_CONTAINER_NAME}'].exitCode | [0]" --output text)
          STOPPED_REASON=$(aws ecs describe-tasks \
            --cluster "${{ vars.ECS_CLUSTER_NAME }}" \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].stoppedReason' --output text)

          echo "Migration task exit code: $EXIT_CODE (stoppedReason: $STOPPED_REASON)"

          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::Database migrations failed -- aborting before services switch to the new task definition."
            exit 1
          fi

          echo "Database migrations applied."

      # Both services switch only after migrations succeed, so a failed migration leaves the
      # currently-running code untouched.
      - name: Point services at the new task definitions
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER_NAME }}" \
            --service "${{ vars.ECS_FRONTEND_SERVICE_NAME }}" \
            --task-definition "$NEW_FRONTEND_TD_ARN"

          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER_NAME }}" \
            --service "${{ vars.ECS_BACKEND_SERVICE_NAME }}" \
            --task-definition "$NEW_BACKEND_TD_ARN"

      - name: Wait for stable services
        id: wait_stable
        continue-on-error: true
        run: |
          set -euo pipefail
          aws ecs wait services-stable \
            --cluster "${{ vars.ECS_CLUSTER_NAME }}" \
            --services "${{ vars.ECS_FRONTEND_SERVICE_NAME }}" "${{ vars.ECS_BACKEND_SERVICE_NAME }}"

      - name: Roll back ECS services on failed stabilization
        if: steps.wait_stable.outcome == 'failure'
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER_NAME }}" \
            --service "${{ vars.ECS_FRONTEND_SERVICE_NAME }}" \
            --task-definition "$PREVIOUS_FRONTEND_TD_ARN"

          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER_NAME }}" \
            --service "${{ vars.ECS_BACKEND_SERVICE_NAME }}" \
            --task-definition "$PREVIOUS_BACKEND_TD_ARN"

          aws ecs wait services-stable \
            --cluster "${{ vars.ECS_CLUSTER_NAME }}" \
            --services "${{ vars.ECS_FRONTEND_SERVICE_NAME }}" "${{ vars.ECS_BACKEND_SERVICE_NAME }}"

      - name: Fail workflow after rollback
        if: steps.wait_stable.outcome == 'failure'
        run: |
          echo "Deployment failed to stabilize and was rolled back to previous task definitions."
          exit 1
