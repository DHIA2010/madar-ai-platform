name: Sync Schedule Tick

# Real periodic trigger for connection_sync_schedules -- ECS/the backend has no cron of its own
# and Terraform doesn't model the backend's ECS cluster/service in this repo (it's managed the
# same way the deploy workflow already treats it: task definitions and running tasks resolved
# live via the AWS CLI, not Terraform state), so this reuses that exact same pattern instead of
# introducing a second way of reaching the same infrastructure.
#
# Runs the scheduler tick as a one-off Fargate task on whatever task definition the backend
# service is CURRENTLY running (no new revision registered here, unlike a deploy) -- so it
# always executes with the same code, env, and VPC access the live service has.
on:
  schedule:
    # Every 15 minutes -- the finest preset on the schedule settings page (كل 15 دقيقة), so no
    # configured schedule can be due more often than this actually ticks.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - stage
          - production
        default: stage

permissions:
  id-token: write
  contents: read

concurrency:
  group: scheduler-tick-${{ inputs.environment || 'stage' }}
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    # The schedule trigger has no `inputs` context, so it always targets stage -- a manual
    # workflow_dispatch run is the only way to tick production, same asymmetry the deploy
    # workflow avoids by requiring an explicit choice every time it runs at all.
    environment: ${{ inputs.environment || 'stage' }}
    timeout-minutes: 10

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run scheduler tick
        run: |
          set -euo pipefail

          TASK_DEFINITION_ARN=$(aws ecs describe-services \
            --cluster "${{ vars.ECS_CLUSTER_NAME }}" \
            --services "${{ vars.ECS_BACKEND_SERVICE_NAME }}" \
            --query 'services[0].taskDefinition' --output text)

          NETWORK_CONFIG=$(aws ecs describe-services \
            --cluster "${{ vars.ECS_CLUSTER_NAME }}" \
            --services "${{ vars.ECS_BACKEND_SERVICE_NAME }}" \
            --query 'services[0].networkConfiguration' --output json)

          CONTAINER_NAME=$(aws ecs describe-task-definition \
            --task-definition "$TASK_DEFINITION_ARN" \
            --query 'taskDefinition.containerDefinitions[0].name' --output text)

          OVERRIDES=$(jq -n --arg NAME "$CONTAINER_NAME" '
            {containerOverrides: [{name: $NAME, command: ["node","--import","tsx","src/identity-platform/integrations/scheduling/scheduler-tick.ts"]}]}
          ')

          TASK_ARN=$(aws ecs run-task \
            --cluster "${{ vars.ECS_CLUSTER_NAME }}" \
            --task-definition "$TASK_DEFINITION_ARN" \
            --launch-type FARGATE \
            --network-configuration "$NETWORK_CONFIG" \
            --overrides "$OVERRIDES" \
            --started-by "scheduler-tick" \
            --query 'tasks[0].taskArn' --output text)

          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
            echo "::error::Failed to start the scheduler-tick task."
            exit 1
          fi

          echo "Scheduler tick task: $TASK_ARN"
          aws ecs wait tasks-stopped \
            --cluster "${{ vars.ECS_CLUSTER_NAME }}" \
            --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "${{ vars.ECS_CLUSTER_NAME }}" \
            --tasks "$TASK_ARN" \
            --query "tasks[0].containers[?name=='${CONTAINER_NAME}'].exitCode | [0]" --output text)
          STOPPED_REASON=$(aws ecs describe-tasks \
            --cluster "${{ vars.ECS_CLUSTER_NAME }}" \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].stoppedReason' --output text)

          echo "Scheduler tick exit code: $EXIT_CODE (stoppedReason: $STOPPED_REASON)"

          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::Scheduler tick task failed (see CloudWatch logs for this task for the actual error)."
            exit 1
          fi
